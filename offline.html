<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sem conexão · FinanceFlow</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--txt:#1e293b;--sub:#64748b}
@media(prefers-color-scheme:dark){:root{--bg:#050816;--card:#0f172a;--txt:#e2e8f0;--sub:#94a3b8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
div{background:var(--card);border-radius:22px;padding:28px;max-width:340px;text-align:center}
img{width:64px;height:64px;border-radius:18px}h1{font-size:1.2rem;margin:14px 0 6px}p{color:var(--sub);margin:0 0 18px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#4f46e5)}
</style>
</head>
<body><div><img src="icons/icon-192.png" alt=""><h1>Sem conexão</h1><p>O FinanceFlow precisa de internet para carregar seus dados com segurança.</p><button onclick="location.reload()">Tentar de novo</button></div></body>
</html>
